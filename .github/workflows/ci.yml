name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install firejail
        run: sudo apt-get update && sudo apt-get install -y firejail

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs,otel,service]" build

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Test
        run: pytest

      - name: Docs
        run: mkdocs build --strict

      - name: Build wheel
        run: python -m build

      - name: Install wheel and run the command
        run: |
          python -m pip install --force-reinstall dist/*.whl
          agentshield --version

      # Runs last, as root, so the agent child really switches to `nobody`.
      # The checkout is made world-readable so that user can import it.
      - name: Agent runs as a separate user (root)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          d="$GITHUB_WORKSPACE"
          while [ "$d" != "/" ]; do d="$(dirname "$d")"; chmod o+x "$d" 2>/dev/null || true; done
          chmod -R o+rX "$GITHUB_WORKSPACE"
          sudo -E env "PATH=$PATH" python -m pytest -p no:cacheprovider -rs tests/test_agent_user.py | tee agent-user.txt
          if grep -q "switching users needs root" agent-user.txt; then
            echo "the root-only test was skipped" >&2
            exit 1
          fi

  frontend:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: npm ci && npm run build
