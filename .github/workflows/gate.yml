name: Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  careful:
    name: Careful agent passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          agent: examples.careful_agent.agent:agent
          suites: src/agentshield/scenarios/suites
          policy: src/agentshield/scoring/default_policy.yaml

  leaky:
    name: Leaky agent fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          agent: examples.leaky_agent.agent:agent
          suites: src/agentshield/scenarios/suites
          policy: src/agentshield/scoring/default_policy.yaml
      - name: The leaky agent must fail the gate
        run: |
          if [ "${{ steps.gate.outputs.exit_code }}" != "1" ]; then
            echo "the leaky agent should break a rule (exit 1), got '${{ steps.gate.outputs.exit_code }}'"
            exit 1
          fi
