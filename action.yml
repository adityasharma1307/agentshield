name: Agentshield gate
description: Run an agent against scenario suites and fail when a policy rule breaks.
inputs:
  agent:
    description: Agent entry as module:attribute.
    required: true
  suites:
    description: Directory of scenario YAML files.
    required: true
  policy:
    description: Policy YAML file.
    required: true
  fail_on:
    description: Lowest severity that fails the job. One of low, medium, high, critical.
    required: false
    default: high
outputs:
  exit_code:
    description: Exit code from agentshield run. 0 passed, 1 a rule broke, 2 the run itself errored.
runs:
  using: docker
  image: action.Dockerfile
  args:
    - ${{ inputs.agent }}
    - ${{ inputs.suites }}
    - ${{ inputs.policy }}
    - ${{ inputs.fail_on }}
