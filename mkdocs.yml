site_name: AgentSheild
site_description: Compliance and red-teaming harness for tool-using LLM agents.
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Writing scenarios: writing-scenarios.md
  - Policy reference: policy-reference.md
  - Threat model: threat-model.md
  - Roadmap: roadmap.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
plugins:
  - search
