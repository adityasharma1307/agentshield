[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentshield"
dynamic = ["version"]
description = "Compliance and red-teaming harness for tool-using LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "agents", "red-team", "audit", "policy", "evaluation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pydantic>=2.10",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pre-commit>=4",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
]
openai = [
    "openai>=1.50",
]
langgraph = [
    "langgraph>=0.2",
]
docs = [
    "mkdocs-material>=9.5",
]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
judge = []
pq = [
    "liboqs-python>=0.12",
]
qknot = [
    "qknot>=0.1.1",
]
bench = [
    "litellm>=1.50",
]
service = [
    "fastapi>=0.115",
    "sqlalchemy>=2",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5",
    "arq>=0.26",
    "uvicorn>=0.32",
]

[project.scripts]
agentshield = "agentshield.cli:main"

[tool.hatch.version]
path = "src/agentshield/__init__.py"

[tool.hatch.build.targets.sdist]
artifacts = [
  "src/agentshield/scenarios/suites/**/*.yaml",
  "src/agentshield/scoring/default_policy.yaml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]
extend-exclude = [".venv", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["agentshield", "examples"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
files = ["src/agentshield", "tests", "examples"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "openai",
    "openai.*",
    "langgraph",
    "langgraph.*",
    "opentelemetry",
    "opentelemetry.*",
    "oqs",
    "oqs.*",
    "qknot",
    "qknot.*",
    "arq",
    "arq.*",
    "alembic",
    "alembic.*",
    "litellm",
    "litellm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-config"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "integration: needs Postgres at AGENTSHIELD_TEST_DATABASE_URL",
]
