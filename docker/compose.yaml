# `docker compose up` starts the API, the worker, Postgres, and Redis.
# Jaeger stays on the debug profile: `docker compose --profile debug up`.
# Create the signing key first. There is no default, and the API and worker
# will not start without it. It is mounted as a Docker secret, and only root
# in the api and worker containers can read it:
#   mkdir -p docker/secrets
#   (umask 077; openssl rand -hex 32 > docker/secrets/signing_key)
#   sudo chown root:root docker/secrets/signing_key
# The worker runs each agent as the unprivileged `agent` user, which can't read
# that file or the worker's /proc entries.
#
# Required before `up` (no defaults, compose refuses to start without them):
#   POSTGRES_PASSWORD, REDIS_PASSWORD
# Use URL-safe values (letters, digits, - and _), because both are embedded in
# connection URLs below.
# Optional: AGENTSHIELD_ALLOWED_AGENTS (comma-separated module:attribute or
# package.*) and AGENTSHIELD_ALLOWED_ROOTS. With no agents allowed, POST /runs
# answers 403.
#
# Only the API (and Jaeger, on the debug profile) publish ports, and only on
# 127.0.0.1. Postgres and Redis are reachable on the compose network only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: agentshield

  redis:
    image: redis:7
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      AGENTSHIELD_DATABASE_URL: postgresql+psycopg://agentshield:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/agentshield
      AGENTSHIELD_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      AGENTSHIELD_ALLOWED_AGENTS: ${AGENTSHIELD_ALLOWED_AGENTS:-}
      AGENTSHIELD_ALLOWED_ROOTS: ${AGENTSHIELD_ALLOWED_ROOTS:-}
      AGENTSHIELD_SIGNING_SECRET_FILE: /run/secrets/signing_key
    secrets:
      - signing_key
    # Root only to read the root-owned 0600 key; every capability is dropped.
    user: "0:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    entrypoint: ["python", "-m", "uvicorn"]
    command:
      - agentshield.service.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      AGENTSHIELD_DATABASE_URL: postgresql+psycopg://agentshield:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/agentshield
      AGENTSHIELD_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      AGENTSHIELD_SIGNING_SECRET_FILE: /run/secrets/signing_key
      # The agent child runs as this user. The worker refuses to start if it
      # can't switch to it.
      AGENTSHIELD_AGENT_USER: agent
    secrets:
      - signing_key
    # Root reads the key and starts each agent as `agent`. Only SETUID and
    # SETGID are kept, and the agent child gets no capabilities.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    entrypoint: ["arq"]
    command:
      - agentshield.service.worker.WorkerSettings

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles:
      - debug
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

secrets:
  signing_key:
    file: ./secrets/signing_key
