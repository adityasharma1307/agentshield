# Jaeger is optional. `docker compose up` does not start it.
# `docker compose --profile debug up` does.
services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles:
      - debug
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
